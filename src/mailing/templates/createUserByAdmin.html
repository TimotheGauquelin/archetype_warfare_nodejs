<!-- src/mailing/templates/createUserByAdmin.html -->
<!DOCTYPE html>
<html lang="{{lang}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #222
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
            padding: 32px
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 16px
        }

        .logo img {
            max-width: 160px;
            height: auto
        }

        h2 {
            margin: 0 0 16px;
            font-size: 22px;
            line-height: 1.3;
            color: #1f2937;
            text-align: center
        }

        .content {
            margin-top: 8px
        }

        p {
            margin: 0 0 12px;
            line-height: 1.6;
            color: #374151
        }

        .card {
            background: #f8fafc;
            border: 1px solid #eef2f7;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0
        }

        .label {
            color: #374151
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none
        }

        .cta {
            display: flex;
            justify-content: center;
            margin: 12px 0
        }

        .link {
            color: #2563eb;
            word-break: break-all;
            background: #f3f4f6;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            color: #6b7280;
            font-size: 12px
        }

        a {
            color: #2563eb;
            text-decoration: none
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="https://res.cloudinary.com/dqfuwqmql/image/upload/v1761127958/archetype_battle_logo_cpcssf.png"
                alt="Archetype Battle">
        </div>

        <h2>{{t.heading}}</h2>

        <div class="content">
            <p>{{t.greeting}}</p>
            <p>{{t.intro}}</p>

            <div class="card">
                <p><strong class="label">{{t.usernameLabel}}</strong> {{username}}</p>
                <p><strong class="label">{{t.emailLabel}}</strong> {{email}}</p>
            </div>

            <p>{{t.setPasswordIntro}}</p>
            <div class="cta">
                <a href="{{resetLink}}" class="button">{{t.cta}}</a>
            </div>
            <p>{{t.fallbackLink}}</p>
            <p class="link">{{resetLink}}</p>
            <p>{{t.expiry}}</p>
            <p>{{t.common.team}}</p>
        </div>

        <div class="footer">
            <p>{{t.common.autoFooter}}</p>
            <p>&copy; {{year}} Archetype Battle. {{t.common.copyright}}</p>
        </div>
    </div>
</body>

</html>
